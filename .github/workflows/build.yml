# Every push and pull request: build and test on a GitHub-hosted Windows runner.
# A version tag (vX.Y.Z matching VERSION): the same, then the release zip is packaged, given a signed
# SLSA build-provenance attestation, and attached to the tag's GitHub release (a draft if none exists).
#   gh attestation verify DeckBtService-X.Y.Z.zip --repo ethanm0202/DeckBtService
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        shell: cmd
        run: tools\ci.cmd

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match VERSION $version" }
      - name: Build, test and package
        shell: cmd
        run: tools\ci.cmd package
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/DeckBtService-*.zip
            tools/_build/package-release/deckbt-usbip.exe
            tools/_build/package-release/deckbt-uartprobe.exe
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter 'DeckBtService-*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip.FullName --repo $env:GITHUB_REPOSITORY --draft --verify-tag `
              --title "DeckBtService $tag" `
              --notes "Built and attested by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID. SHA-256 of $($zip.Name): $hash"
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
          "SHA-256 of $($zip.Name): ``$hash``" >> $env:GITHUB_STEP_SUMMARY
